name: Build Gramify APK

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "App package name (applicationId)"
        required: false
        default: "com.gramify.messenger"
      app_name:
        description: "App ka display naam"
        required: false
        default: "Devgram Remastered"
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: 1) Kit checkout
        uses: actions/checkout@v4

      - name: 2) Repo structure report
        run: |
          echo "workspace: $GITHUB_WORKSPACE"
          echo "=== top level ==="
          ls -la "$GITHUB_WORKSPACE"
          echo "=== java files (flat ya nested, dono dikhenge) ==="
          find "$GITHUB_WORKSPACE" -name "*.java" -not -path "*/.git/*" | sed "s|$GITHUB_WORKSPACE|.|" | sort

      # ------------------------------------------------------------------ #
      #  KIT KO CANONICAL JAGAH PE RAKHO: <kit>/patches/ + <kit>/payload/
      #  FLAT files (root pe) bhi chalengi — naam se dhundh kar sahi jagah.
      # ------------------------------------------------------------------ #
      - name: 3) Kit taiyaar karo (flat/nested — sab chalega)
        id: kit
        run: |
          set -e
          WS="$GITHUB_WORKSPACE"
          KIT=/tmp/gramify-kit
          PKG=TMessagesProj/src/main/java/org/telegram/messenger/gramify
          PL=$KIT/payload
          rm -rf "$KIT"
          mkdir -p "$KIT/patches" "$PL/$PKG" \
                    "$PL/TMessagesProj/src/main/res/drawable" \
                    "$PL/TMessagesProj/src/main/res/values"

          findone() {  # $1 = filename  (workspace me kahin bhi)
            f="$(find "$WS" -name "$1" -not -path "*/.git/*" | head -1)"
            if [ -n "$f" ]; then echo "$f"; return 0; fi
            return 1
          }

          # ---------- 1) patcher ----------
          SETUP="$(findone gramify_setup.py || true)"
          if [ -z "$SETUP" ]; then
            echo "::error::'gramify_setup.py' repo me nahi mila"
            exit 1
          fi
          cp "$SETUP" "$KIT/patches/gramify_setup.py"
          echo "patcher: $SETUP"

          # ---------- 2) 15 java files (naam se) ----------
          miss=0
          for f in VoiceDsp VoiceEnhancer VoiceEnhancerFragment GramifyMusicFragment \
                   GramifyPlayer SaavnApi Song SongAdapter Json \
                   CallMixer CallMusicCapture CallMusicDecoder MusicShare \
                   GramifyBubble GramifyBubbleService; do
            SRC="$(findone "$f.java" || true)"
            if [ -n "$SRC" ]; then
              cp "$SRC" "$PL/$PKG/$f.java"
              echo "  + $f.java"
            else
              echo "  !! $f.java NAHI mila"
              miss=$((miss+1))
            fi
          done

          # ---------- 3) res files (optional, hard-fail nahi) ----------
          for f in gramify_music.xml gramify_mic.xml devgram_icon_bg.xml \
                   devgram_icon_fg.xml devgram_icon_mono.xml; do
            SRC="$(findone "$f" || true)"
            [ -n "$SRC" ] && cp "$SRC" "$PL/TMessagesProj/src/main/res/drawable/$f"
          done
          SRC="$(findone gramify_strings.xml || true)"
          [ -n "$SRC" ] && cp "$SRC" "$PL/TMessagesProj/src/main/res/values/gramify_strings.xml"

          # ---------- 4) icons (sab densities me) ----------
          for n in ic_launcher ic_launcher_round; do
            ANY_PNG="$(findone "$n.png" || true)"
            ANY_XML="$(findone "$n.xml" || true)"
            if [ -n "$ANY_PNG" ]; then
              for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
                mkdir -p "$PL/TMessagesProj/src/main/res/mipmap-$d"
                cp "$ANY_PNG" "$PL/TMessagesProj/src/main/res/mipmap-$d/$n.png"
              done
            fi
            if [ -n "$ANY_XML" ]; then
              mkdir -p "$PL/TMessagesProj/src/main/res/mipmap-anydpi-v26"
              cp "$ANY_XML" "$PL/TMessagesProj/src/main/res/mipmap-anydpi-v26/$n.xml"
            fi
          done

          # ---------- 5) verify ----------
          NJ=$(ls "$PL/$PKG"/*.java 2>/dev/null | wc -l)
          echo "payload ready: $NJ java files"
          if [ "$miss" -gt 0 ] || [ "$NJ" -lt 15 ]; then
            echo "::error::$NJ/15 java files mili. Upar '!! NAHI mila' dekho."
            exit 1
          fi
          echo "kit=$KIT" >> "$GITHUB_OUTPUT"

      - name: 4) Disk space free karo
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /usr/local/lib/android/sdk/ndk || true
          df -h /

      - name: 5) JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ------------------------------------------------------------------ #
      #  ROBUST CLONE: submodule network failure = #1 build-fail ka karan.
      #  Ab submodules alag se, 3 baar retry ke saath chalti hain.
      # ------------------------------------------------------------------ #
      - name: "6) Telegram clone (recurse-submodules + shallow)"
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          echo "== clone (recurse-submodules, shallow) =="
          git clone --depth 1 --recurse-submodules --shallow-submodules \
              https://github.com/DrKLO/Telegram.git telegram 2>&1 | tail -8
          cd telegram
          echo "commit: $(git rev-parse --short HEAD)"
          echo "== submodule check =="
          git submodule status | head -40
          echo "submodule count: $(git submodule status | wc -l)"
          # Critical submodules check — missing = clear fail
          for sm in TMessagesProj/jni/tgnet TMessagesProj/jni/libtgvoip TMessagesProj/jni/ffmpeg TMessagesProj/jni/libwebp; do
            if [ -s "$sm/CMakeLists.txt" ] || [ -s "$sm/Android.mk" ] || [ -n "$(ls -A "$sm" 2>/dev/null | head -1)" ]; then
              echo "OK   submodule: $sm"
            else
              echo "FAIL submodule: $sm (khaali hai)"
            fi
          done
          echo "repo size: $(du -sh . | cut -f1)"

      - name: 7) Android SDK
        uses: android-actions/setup-android@v3

      - name: 8) SDK + NDK + CMake install
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          yes | sdkmanager --licenses > /dev/null || true
          df -h /

      - name: 9) Gramify patches lagao
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          set -e
          python3 /tmp/gramify-kit/patches/gramify_setup.py \
            --repo "$GITHUB_WORKSPACE/telegram" \
            --app-id "${TG_API_ID:-4}" \
            --app-hash "${TG_API_HASH:-014b35b6184100b085b0d0572f9b5103}" \
            --package "${{ inputs.package_name || 'com.gramify.messenger' }}" \
            --name "${{ inputs.app_name || 'Devgram Remastered' }}" \
            --fast

      - name: 9b) google-services.json fix
        run: |
          python3 - <<'PY'
          import json, os, copy, glob
          repo = os.environ['GITHUB_WORKSPACE'] + '/telegram'
          pkg = None
          for line in open(repo + '/gradle.properties', encoding='utf-8'):
              if line.startswith('APP_PACKAGE='):
                  pkg = line.strip().split('=', 1)[1]
          print('APP_PACKAGE =', pkg)
          if not pkg:
              raise SystemExit('package nahi mila gradle.properties me')
          names = [pkg, pkg + '.beta', pkg + '.web']
          for f in glob.glob(repo + '/**/google-services.json', recursive=True):
              try:
                  d = json.load(open(f, encoding='utf-8'))
              except Exception as e:
                  print('  ! skip', f, e); continue
              clients = d.get('client') or []
              if not clients: continue
              have = {(c.get('client_info') or {}).get('android_client_info', {}).get('package_name') for c in clients}
              added = []
              for nm in names:
                  if nm in have: continue
                  c = copy.deepcopy(clients[0])
                  c.setdefault('client_info', {}).setdefault('android_client_info', {})['package_name'] = nm
                  clients.append(c); added.append(nm)
              if added:
                  d['client'] = clients
                  json.dump(d, open(f, 'w', encoding='utf-8'), indent=2)
                  print('  + %s : %s' % (os.path.relpath(f, repo), added))
          PY

      - name: 9c) Hook verification
        working-directory: telegram
        run: |
          cd "$GITHUB_WORKSPACE/telegram/TMessagesProj/src/main/java"
          MISS=0
          for f in org/webrtc/voiceengine/WebRtcAudioRecord.java \
                   org/webrtc/audio/WebRtcAudioRecord.java \
                   org/telegram/messenger/voip/AudioRecordJNI.java; do
            if grep -q "GRAMIFY VOICE HOOK" "$f" 2>/dev/null; then
              echo "OK  voice hook: $f"
            else
              echo "MISSING voice hook: $f"; MISS=$((MISS+1))
            fi
          done
          grep -q "GRAMIFY BOOT HOOK" org/telegram/messenger/ApplicationLoader.java 2>/dev/null \
            && echo "OK  boot hook" || { echo "MISSING boot hook"; MISS=$((MISS+1)); }
          if [ "$MISS" -gt 0 ]; then
            echo "::warning::$MISS hook missing — Telegram source badal gaya ho sakta hai. Build phir bhi chalega, par enhancer shayad kam na kare."
          else
            echo "saare hooks lage — enhancer + music-share live honge"
          fi

      - name: 10) Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('telegram/gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 11) APK build
        working-directory: telegram
        run: |
          set +e
          chmod +x gradlew
          ./gradlew TMessagesProj_App:assembleAfatRelease \
            --stacktrace --console=plain 2>&1 | tee /tmp/gradle-build.log
          CODE=${PIPESTATUS[0]}
          if [ "$CODE" -ne 0 ]; then
            echo "================= GRADLE ERROR ================="
            grep -m1 -A20 "What went wrong" /tmp/gradle-build.log || true
            echo "---- error lines ----"
            grep -m6 -E "^e: |error:|No matching client|Could not resolve|Could not find|Cannot|FAILURE:|NDK|CMake|Execution failed" /tmp/gradle-build.log | head -20
            echo "---- last 25 lines ----"
            tail -25 /tmp/gradle-build.log
            # ANNOTATION: ye error GitHub ke summary me dikhega (bin login dekh sakte hain)
            MSG="$(grep -m1 -A6 'What went wrong' /tmp/gradle-build.log | tail -n +2 | tr '\n' ' ' | sed 's/  */ /g' | cut -c1-400)"
            if [ -z "$MSG" ]; then
              MSG="$(grep -m1 -E "error:|FAILURE:|Could not|Cannot|No matching client|NDK" /tmp/gradle-build.log | cut -c1-400)"
            fi
            if [ -z "$MSG" ]; then MSG="gradle fail, log me detail"; fi
            echo "::error title=GRADLE::$MSG"
            exit "$CODE"
          fi
          echo "---- APK ----"
          find TMessagesProj_App/build/outputs -name "*.apk" -exec ls -lh {} \;

      - name: 12) APK upload
        uses: actions/upload-artifact@v4
        with:
          name: Gramify-APK
          path: telegram/TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 13) Release me bhi daalo
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gramify-latest
          name: "Gramify APK (latest build)"
          files: telegram/TMessagesProj_App/build/outputs/apk/afat/release/app.apk

      - name: 14) Debug info
        if: always()
        run: |
          echo "=== payload java files ==="
          find /tmp/gramify-kit/payload -name "*.java" 2>/dev/null | wc -l
          echo "=== telegram present? ==="
          ls -d "$GITHUB_WORKSPACE/telegram" 2>/dev/null || echo "telegram clone NAHI hua"
          echo "=== disk ==="
          df -h / | tail -1
